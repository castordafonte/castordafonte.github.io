<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada · Castor Dafonte</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background:
                radial-gradient(80% 60% at 100% 0%, rgba(15, 108, 189, 0.35), transparent 60%),
                radial-gradient(60% 50% at 0% 100%, rgba(255, 140, 42, 0.25), transparent 60%),
                #0b1120;
            color: #e6edf6;
            display: grid;
            place-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: min(100%, 560px);
            text-align: center;
            padding: clamp(2rem, 6vw, 3.5rem);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
        }
        .mark {
            display: inline-grid;
            place-items: center;
            width: 56px; height: 56px;
            border-radius: 16px;
            background: #0b1120;
            color: #ff8c2a;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            box-shadow: inset 0 0 0 1px rgba(255, 140, 42, 0.45), 0 8px 24px rgba(255, 140, 42, 0.25);
            margin-bottom: 1.5rem;
        }
        .code {
            font-family: 'Sora', sans-serif;
            font-size: clamp(5rem, 18vw, 8rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(100deg, #7fc0f5, #27c3f2 55%, #7fc0f5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0.8rem 0 0.6rem;
        }
        p { color: #a9b6c8; margin-bottom: 2rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.6rem;
            padding: 0.9rem 1.6rem;
            border-radius: 999px;
            background: linear-gradient(135deg, #0f6cbd, #27c3f2);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 10px 28px rgba(15, 108, 189, 0.4);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(15, 108, 189, 0.5); }
    </style>
</head>
<body>
    <main class="card">
        <span class="mark" aria-hidden="true">CD</span>
        <div class="code" aria-hidden="true">404</div>
        <h1>Página no encontrada</h1>
        <p>La página que buscas no existe o se ha movido. Volvamos a terreno conocido.</p>
        <a href="/" class="btn">&larr; Volver al inicio</a>
    </main>
</body>
</html>
